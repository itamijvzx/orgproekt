# Test process creates and drops ONLY a randomly named orgproekt_test_* database.
services:
  tests:
    logging:
      driver: local
      options: {max-size: '10m', max-file: '3', compress: 'true'}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    image: orgproekt-backend-test:local
    profiles: [tests]
    environment:
      TEST_ADMIN_URL: postgresql+psycopg://orgproekt_owner:${DB_ADMIN_PASSWORD}@db/orgproekt
      DATABASE_URL: postgresql+psycopg://orgproekt_app:${DB_APP_PASSWORD}@db/orgproekt
      BROKER_URL: amqp://orgproekt:${RABBITMQ_PASSWORD}@rabbitmq:5672//
      APP_MODE: test
      APP_ORIGIN: http://testserver
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY}
    command: [pytest, -q, --tb=short, -p, no:cacheprovider]
    volumes: [./backend/tests:/app/tests:ro, parser_socket:/app/parser-socket]
    networks: [internal]
    depends_on:
      db: {condition: service_healthy}
      parser: {condition: service_healthy}

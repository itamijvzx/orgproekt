# Separate project: docker compose -p orgproekt-e2e -f compose.yml -f compose.e2e.yml ...
services:
  api:
    environment: { LOCAL_DEMO_MODE: "false", APP_ORIGIN: "http://orgproekt.localhost:8080" }
  worker:
    environment: { LOCAL_DEMO_MODE: "false", APP_ORIGIN: "http://orgproekt.localhost:8080" }
  scheduler:
    environment: { LOCAL_DEMO_MODE: "false", APP_ORIGIN: "http://orgproekt.localhost:8080" }
  migrate:
    environment: { LOCAL_DEMO_MODE: "false", APP_ORIGIN: "http://orgproekt.localhost:8080" }
  tools:
    build: {context: ., dockerfile: backend/Dockerfile, target: test}
    image: orgproekt-backend-test:local
    environment: { LOCAL_DEMO_MODE: "false", APP_ORIGIN: "http://orgproekt.localhost:8080" }
    volumes: !override [./.local/e2e:/private]
  caddy:
    image: orgproekt-caddy:latest
    # Node's API client also needs loopback resolution on isolated Docker networks.
    extra_hosts: [orgproekt.localhost:127.0.0.1]
    ports: !override [127.0.0.1:8081:8080]
  e2e:
    logging:
      driver: local
      options: { max-size: "10m", max-file: "3", compress: "true" }
    image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
    profiles: [e2e]
    working_dir: /app
    network_mode: service:caddy
    volumes:
      - ./frontend:/app
      - ./.local/e2e:/private
      - ./docs/screenshots:/screenshots
    environment:
      CI: "1"
      PLAYWRIGHT_BASE_URL: http://orgproekt.localhost:8080
    command: [npm, run, test:e2e]
    depends_on: [caddy]

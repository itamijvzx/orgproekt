# Standalone file. NEVER merge with compose.yml; no shared volumes/networks or migrations.
x-logging: &logging
  driver: local
  options:
    max-size: '10m'
    max-file: '3'
    compress: 'true'
services:
  db:
    logging: *logging
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_DB: orgproekt
      POSTGRES_USER: orgproekt_owner
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?}
    command: [postgres, -c, 'orgproekt.restore_id=${RESTORE_ID:?}']
    volumes:
      - restored_db:/var/lib/postgresql/data
      - ./infra/postgres-init.sh:/docker-entrypoint-initdb.d/01-app.sh:ro
    networks: [isolated]
    healthcheck:
      test: [CMD, pg_isready, -U, orgproekt_owner, -d, orgproekt]
      interval: 2s
      timeout: 3s
      retries: 40
    labels:
      orgproekt.restore-lab: ${RESTORE_ID:?}
  api:
    logging: *logging
    image: ${RESTORE_APP_IMAGE:?}
    environment:
      APP_MODE: development
      APP_ORIGIN: http://localhost:8082
      DATABASE_URL: postgresql+psycopg://orgproekt_app:${DB_APP_PASSWORD:?}@db/orgproekt
      BROKER_URL: amqp://disabled:disabled@unavailable//
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?}
      GEMINI_ENABLED: 'false'
      GEMINI_API_KEY: ''
    depends_on:
      db: {condition: service_healthy}
    networks: [isolated]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/health", timeout=3)']
      interval: 2s
      timeout: 3s
      retries: 30
  caddy:
    logging: *logging
    image: ${RESTORE_WEB_IMAGE:?}
    ports: [127.0.0.1:8082:8082]
    volumes:
      - ${RESTORE_PRIVATE_DIR:?}/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api: {condition: service_healthy}
    networks: [isolated]
    cap_drop: [ALL]
    # The upstream Caddy binary carries this file capability; allow it to exec.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs: [/data, /config]
  browser:
    logging: *logging
    image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    profiles: [qa]
    network_mode: service:caddy
    working_dir: /app
    environment:
      CI: '1'
      PLAYWRIGHT_BASE_URL: http://localhost:8082
      RESTORE_LAB: ${RESTORE_ID:?}
    volumes:
      - ./frontend:/app
      - ${RESTORE_PRIVATE_DIR:?}:/private
    command: [npm, run, test:e2e, --, e2e/restore.spec.ts]
volumes:
  restored_db:
networks:
  isolated:
    internal: true
